<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OrderAPI — Demo UI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>OrderAPI — Demo</h1>

    <section class="box">
      <h2>Place Order</h2>
      <form id="orderForm">
        <label>Product ID <input id="product" value="PROD1" /></label>
        <label>Side
          <select id="side">
            <option value="1">Buy</option>
            <option value="-1">Sell</option>
          </select>
        </label>
        <label>Price <input id="price" type="number" step="0.01" value="120.00" /></label>
        <label>Qty <input id="qty" type="number" value="1" /></label>
        <button type="submit">Place Order</button>
      </form>
      <div id="placeResult" class="muted"></div>
    </section>

    <section class="box split">
      <div>
        <h2>Live Trades</h2>
        <div id="trades" class="list"></div>
        <button id="refreshTrades">Refresh trades (HTTP)</button>
      </div>

      <div>
        <h2>Orderbook (PROD1)</h2>
        <div class="book">
          <div>
            <h3>BIDS</h3>
            <ol id="bids"></ol>
          </div>
          <div>
            <h3>ASKS</h3>
            <ol id="asks"></ol>
          </div>
        </div>
      </div>
    </section>

    <section class="box">
      <h2>Raw API</h2>
      <button id="listOrders">List Orders</button>
      <pre id="rawOut" class="raw"></pre>
    </section>

    <footer>Connects to http://127.0.0.1:8000</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
